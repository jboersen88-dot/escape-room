<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Millionair worden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Concept: een bankkluis-kantoor. Donkerblauw inktpapier, goud als enige accent, grote tikvlakken voor iPad. */
:root{
  --bg:#0e1a2b;
  --panel:#16263d;
  --panel-2:#1d3250;
  --line:#2c4466;
  --fg:#f4efe2;
  --muted:#a3b3ca;
  --gold:#f2b632;
  --gold-ink:#2a1d00;
  --good:#4fd08a;
  --bad:#ff7366;
  --warn:#f2b632;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(242,182,50,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(79,208,138,.06),transparent 60%);
  background-attachment:fixed;
  color:var(--fg);font-family:var(--body);font-size:19px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:920px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(24px,3.6vw,32px);font-weight:800}
h3{font-size:20px;font-weight:600}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em;color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:14px;letter-spacing:0}
.chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.purse{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 8px;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--gold) 60%,#b8821a);color:var(--gold-ink);display:grid;place-items:center;font-size:17px;font-weight:800}
.digits{display:flex;gap:6px}
.dg{min-width:44px;height:44px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-weight:800;font-size:22px}
.dg.has{border:1px solid var(--gold);color:var(--gold);background:rgba(242,182,50,.1)}

main{padding-top:26px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.lead{color:var(--muted);max-width:60ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{min-height:54px;padding:12px 24px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:700;font-size:19px;touch-action:manipulation}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:8px 16px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 4px;font-size:16px}

/* inputs */
input[type=text],textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:20px}
input[type=text]:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:150px;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:16px}
.inl{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.inl input{flex:1 1 180px;width:auto}
.unit{display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--gold);font-size:22px;padding:0 4px}
.bad-field{border-color:var(--bad)!important}
.good-field{border-color:var(--good)!important}

/* lobby */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.door{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:170px;cursor:pointer;color:inherit}
.door .num{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold)}
.door .nm{font-family:var(--display);font-weight:800;font-size:22px}
.door .sub{color:var(--muted);font-size:16px}
.door .st{margin-top:auto;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.door.open{border-color:var(--gold)}
.door.open .st{color:var(--gold)}
.door.klaar{border-color:var(--good);background:linear-gradient(180deg,rgba(79,208,138,.10),var(--panel))}
.door.klaar .st{color:var(--good)}
.door.lock{opacity:.85}
.door.soon{opacity:.5;cursor:default}
.door .big{position:absolute;right:16px;top:14px;font-family:var(--display);font-weight:800;font-size:44px;color:var(--good)}

/* question */
.prog{display:flex;gap:5px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.d{background:var(--good)}
.prog i.c{background:var(--gold)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:16px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.q{font-size:22px;line-height:1.4}
.formula{font-family:var(--display);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 14px;color:var(--gold);display:inline-block;font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;min-height:60px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:20px}
.opt .bx{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted)}
.opt.multi .bx{border-radius:7px}
.opt.sel{border-color:var(--gold);background:rgba(242,182,50,.08)}
.opt.sel .bx{background:var(--gold);border-color:var(--gold)}
.opt.ok{border-color:var(--good);background:rgba(79,208,138,.12)}
.opt.no{border-color:var(--bad);background:rgba(255,115,102,.10)}
.opt[disabled]{cursor:default}

/* koppel */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media(max-width:560px){.match{grid-template-columns:1fr}}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{min-height:58px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:left;cursor:pointer;font-size:18px;position:relative}
.mi.pick{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.35)}
.mi.lk{cursor:default}
.mi.c0{border-color:#6aa8ff}.mi.c1{border-color:#ff9bd0}.mi.c2{border-color:#9be28f}.mi.c3{border-color:#ffb36b}.mi.c4{border-color:#c9a6ff}.mi.c5{border-color:#5fe0d6}
.mi .pn{position:absolute;right:10px;top:8px;font-family:var(--display);font-weight:800;font-size:14px;color:var(--muted)}
.mi.ok{background:rgba(79,208,138,.14);border-color:var(--good)}
.mi.no{background:rgba(255,115,102,.12);border-color:var(--bad)}

select{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:19px;color:var(--fg);min-height:52px}
select:focus{border-color:var(--gold);outline:none}
.pr{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.pr input{flex:1 1 140px;width:auto}
.tw{overflow-x:auto}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.bgrid{grid-template-columns:1fr}}
.bcol{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.bcol h4{margin:0 0 8px;font-family:var(--display);font-size:22px;color:var(--gold)}
.brow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bl{flex:1 1 120px}
.brow .bv{font-weight:700;color:var(--fg)}
.brow input{width:140px;padding:10px 12px;font-size:19px}
.brow select{min-height:48px;font-size:17px;padding:8px 10px;max-width:100%}
.btot{margin-top:14px}
table.begr{width:100%;border-collapse:collapse;font-size:18px}
.begr th,.begr td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.begr thead th{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.begr tr.grp th{background:var(--panel-2);color:var(--gold);font-family:var(--display);font-size:20px}
.begr tr.tot td:first-child{font-weight:700}
.begr input{width:150px;padding:10px 12px;font-size:19px}
.begr select{min-height:48px;font-size:17px;padding:8px 10px}

/* feedback + hints */
.fb{border-radius:12px;padding:12px 16px;font-size:18px}
.fb.good{background:rgba(79,208,138,.13);border:1px solid var(--good)}
.fb.bad{background:rgba(255,115,102,.11);border:1px solid var(--bad)}
.fb.info{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.crit{display:flex;flex-direction:column;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.crit li{display:flex;gap:10px}
.crit .k{flex:none;width:22px;font-weight:800}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--bg);border-left:4px solid var(--gold);border-radius:6px 12px 12px 6px;padding:10px 14px;font-size:17px}
.cards{background:var(--bg);border:1px dashed var(--gold);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;font-size:17px}
.tw{background:var(--bg);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin:0 0 10px;overflow-x:auto}
.tt{color:var(--gold);font-weight:700;margin-bottom:6px}
.tb{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.12)}
.tb th:first-child,.tb td.f{text-align:left}
.tb th{color:var(--muted);font-weight:600}
.cards b{color:var(--gold);font-variant-numeric:tabular-nums}
.sc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:18px}
.pay{font-family:var(--display);font-weight:800;color:var(--good)}

/* kluis */
.vault{display:flex;flex-direction:column;gap:18px;align-items:center}
.slots{display:flex;gap:12px}
.slot{width:74px;height:92px;border-radius:14px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:46px;color:var(--gold)}
.slot.f{border-color:var(--gold)}
.tokens{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tok{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);background:var(--panel-2);font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);cursor:pointer}
.tok[disabled]{opacity:.25;cursor:default}
.hist{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}
.hr{display:flex;gap:8px}
.ht{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;position:relative}
.ht.g{background:var(--good);color:#06301a}
.ht.y{background:var(--warn);color:var(--gold-ink)}
.ht.n{background:var(--panel-2);color:var(--muted)}
.ht small{position:absolute;right:4px;bottom:0;font-size:12px;font-family:var(--body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:16px}
.legend span{display:inline-flex;gap:8px;align-items:center}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}

/* einde */
.fin{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.money{font-family:var(--display);font-weight:800;font-size:clamp(60px,14vw,120px);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.stamp{border:3px double var(--gold);border-radius:14px;padding:12px 28px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.08em;color:var(--gold);transform:rotate(-2deg)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:999px;padding:12px 24px;z-index:50;max-width:90vw;text-align:center}
.foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.teacher{border:1px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
@media(prefers-reduced-motion:no-preference){
  main.enter .card,main.enter .door{animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .slot.f{animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
}
</style>

<div class="top"><div class="wrap">
  <div class="brand">MILLIONAIR WORDEN<small id="sub">Economie jaar 2 · Hoofdstuk 2</small></div>
  <div class="chips" id="chips"></div>
</div></div>
<div class="wrap"><main id="main" aria-live="polite"></main></div>
<canvas id="confetti" hidden></canvas>
<div id="toastbox"></div>

<script>
"use strict";
/* =========================================================
   INSTELLINGEN (door de meester aan te passen)
   ========================================================= */
const CONFIG = {
  WORKER_URL: "https://escape-room-ai.nakijker-worker.workers.dev",                       // Cloudflare Worker-adres voor AI-nakijken. Leeg = demo-nakijker (zoekt trefwoorden).
  START_GELD: 500,
  HINT_KOSTEN: [10, 20, 40],
  KAMER_CIJFERS: {1: 3, 2: 5, 3: 7, 4: 9},   // cijfer dat elke kamer oplevert
  KLUISCODE: [7, 3, 9, 5],                    // de juiste volgorde in de kluis
  KAMERCODES: {1: "KANTOOR", 2: "SPAARPOT", 3: "BANKIER", 4: "POLIS"}, // code onder de QR-code
  CODEWOORD: "GOUDEN KLUIS",                  // geheim woord op het eindscherm (voor de beloning)
  ZOEK_PLEKKEN_1: [                            // hints bij het zoeken van de 4 bonnetjes in kamer 1
    "Het eerste bonnetje hangt op een plek waar je kunt schrijven.",
    "Twee bonnetjes hangen dicht bij elkaar, in de buurt van het bord.",
    "Het laatste bonnetje ligt onder of achter iets in het lokaal."
  ],
  ZOEK_PLEKKEN_2: [                            // hints bij het zoeken van de 2 kaartjes in kamer 2
    "Het eerste kaartje zit achter iets waar je de tijd op kunt aflezen.",
    "Het tweede kaartje zit in de buurt van een kast of een lade.",
    "Kijk ook eens onder of achter het bureau van de docent."
  ],
  ZOEK_PLEKKEN_4: [                            // hints bij het zoeken van de 3 kaartjes in kamer 4
    "Het eerste kaartje zit onder iets waar je op kunt zitten.",
    "Het tweede kaartje ligt onder een voorwerp dat op een tafel of vensterbank staat.",
    "Het derde kaartje zit in de buurt van de deur, onder of achter iets."
  ],
  ZOEK_PLEKKEN: [                              // hints bij het zoeken van de 3 kaartjes in kamer 3
    "Het eerste kaartje hangt op een plek waar je naar buiten kijkt.",
    "Het tweede kaartje zit in de buurt van de deur.",
    "Het derde kaartje ligt onder of achter iets in het lokaal."
  ]
};

/* =========================================================
   VRAGEN
   ========================================================= */
const KAMERS = {
  1: {naam: "Het kantoor", par: "2.1 Inkomen en uitgaven", beschikbaar: true},
  2: {naam: "De spaarkamer", par: "2.2 Wat levert sparen op?", beschikbaar: true},
  3: {naam: "De bank", par: "2.3 Waarom zou je lenen?", beschikbaar: true},
  4: {naam: "De verzekeraar", par: "2.4 Verzekeren, hoezo?", beschikbaar: true}
};

const Q = {};
const add = q => { Q[q.id] = q; return q; };

/* ---- meerkeuze ---- */
add({id:"m_delen", type:"mc", pts:10, multi:true, label:"Meerkeuze",
  q:"Uit welke twee delen bestaat een maandtermijn? (meerdere antwoorden goed)",
  opts:["Aflossing","Rente","Premie","Eigen risico"], correct:[0,1],
  hints:["Een maandtermijn betaal je aan de bank. Denk aan: terugbetalen en betalen voor het lenen.",
         "Premie en eigen risico horen bij een ander onderwerp: verzekeren.",
         "Eén goed antwoord is 'het geleende geld terugbetalen', de ander is 'wat je extra betaalt voor het lenen'."]});
add({id:"m_tf", type:"mc", pts:10, label:"Juist of onjuist",
  q:"Juist of onjuist: bij een lening met maandtermijnen betaal je elke maand hetzelfde bedrag.",
  opts:["Juist","Onjuist"], correct:[0], fixedOrder:true,
  hints:["Denk aan een abonnement: je weet vooraf wat je elke maand betaalt.",
         "Bij een maandtermijn is het bedrag van tevoren afgesproken.",
         "Het antwoord is: juist. Het bedrag blijft elke maand gelijk."]});
add({id:"m_leeftijd", type:"mc", pts:10, label:"Meerkeuze",
  q:"Vanaf welke leeftijd mag je zelf geld lenen bij de bank?",
  opts:["Vanaf 14 jaar","Vanaf 16 jaar","Vanaf 18 jaar","Vanaf 21 jaar"], correct:[2], fixedOrder:true,
  hints:["Het gaat om de leeftijd waarop je meerderjarig bent.",
         "Meerderjarig zit tussen 16 en 21 jaar.",
         "Je bent meerderjarig als je 18 bent."]});
add({id:"m_hyp", type:"mc", pts:10, label:"Welke hoort bij...",
  q:"Welke omschrijving hoort bij een hypotheek?",
  opts:["Een lening om een huis te kopen","Een lening om een auto te kopen","Een lening om een reis te boeken","Een lening om kleding te kopen"], correct:[0],
  hints:["Een hypotheek is een heel groot bedrag dat je lang terugbetaalt.",
         "Je woont er straks in.",
         "Het gaat om een huis."]});
add({id:"m_waarom", type:"mc", pts:10, label:"Begrijpen",
  q:"Waarom is dezelfde lening in 2 jaar terugbetalen goedkoper dan in 3 jaar?",
  opts:["Je betaalt over een kortere tijd rente","Je betaalt elke maand minder aflossing","Je krijgt korting van de bank","Je hoeft het geleende bedrag niet terug te betalen"], correct:[0],
  hints:["Kijk naar het aantal maanden waarover je rente betaalt.",
         "Rente betaal je voor elke maand dat je het geld nog niet hebt terugbetaald.",
         "Korter lenen betekent minder maanden rente betalen."]});

/* ---- koppelen ---- */
add({id:"k_lenen", type:"koppel", pts:20, label:"Koppelen",
  q:"Koppel elk begrip aan de juiste uitleg. Tik links op een begrip en daarna rechts op de uitleg.",
  pairs:[["Aflossing","Het geleende geld terugbetalen"],
         ["Rente","Wat je extra betaalt voor het lenen"],
         ["Maandtermijn","Het vaste bedrag dat je elke maand betaalt"],
         ["Persoonlijke lening","Een dure lening bij de bank voor een groot doel"],
         ["Hypotheek","Een lening om een huis te kopen"],
         ["Totale kosten","Maandtermijn x aantal maanden"]],
  hints:["Begin met de makkelijkste: de hypotheek en de aflossing.",
         "Bij 'Totale kosten' staat een rekensom in de uitleg.",
         "Rente is het extra bedrag, aflossing is het terugbetalen van wat je leende."]});

/* ---- rekenen ---- */
const rk = (id, q, formule, raw, dec, unit, hints) => add({id, type:"reken", pts:20, label:"Rekenen", q, formule, raw, dec, unit, hints});
rk("r_totaal","Mats leent €15.000 en betaalt 36 maanden lang €462,96 per maand. Hoeveel betaalt hij in totaal terug?",

function parseNum(str){
  let s = String(str).trim().replace(/[€%\s]/g,"");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}

function lev(a, b){
  const m = a.length, n = b.length, d = Array.from({length:m+1}, (_,i) => [i].concat(Array(n).fill(0)));
  for (let j=1;j<=n;j++) d[0][j] = j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function fuzzyHas(words, text){
  const toks = String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9]+/).filter(Boolean);
  return words.some(w => {
    const ww = w.toLowerCase(), lim = ww.length <= 3 ? 0 : Math.max(1, Math.floor(ww.length/4));
    return toks.some(t => Math.abs(t.length-ww.length) <= lim && lev(t, ww) <= lim) || (ww.length >= 5 && toks.some(t => t.includes(ww)));
  });
}
function critMatch(c, text){ return (c.rx && c.rx.test(text)) || (c.kw && fuzzyHas(c.kw, text)); }

function renderChips(){
  if (S.fase === "start") { $("#chips").innerHTML = ""; return; }
  const dg = [1,2,3,4].map(k => S.cijfers[k] !== undefined
    ? `<div class="dg has" title="Kamer ${k}">${S.cijfers[k]}</div>` : `<div class="dg" title="Kamer ${k}">?</div>`).join("");
  $("#chips").innerHTML = `<div class="digits" aria-label="Verzamelde cijfers">${dg}</div>
    <div class="purse" aria-label="Je geld"><span class="coin">€</span><span id="saldo">${nf(shown)}</span></div>`;
  $("#sub").textContent = S.duo ? "Duo: " + S.duo : "Economie jaar 2 · Hoofdstuk 2";
}
function tweenSaldo(){
  const el = $("#saldo"); if (!el) return;
  const from = shown, to = S.saldo;
  if (from === to) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { shown = to; el.textContent = nf(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1,(t-t0)/600); shown = Math.round(from+(to-from)*p); const e = $("#saldo"); if (e) e.textContent = nf(shown); if (p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

let lastKey = "";
function render(){
  renderChips();
  const key = S.fase + ":" + S.qi + ":" + (S.kamer||"");
  const changed = key !== lastKey;
  const m = $("#main");
  m.classList.toggle("enter", changed);
  if (S.fase === "start") m.innerHTML = vStart();
  else if (S.fase === "lobby") m.innerHTML = vLobby();
  else if (S.fase === "kamer") m.innerHTML = vKamer();
  else if (S.fase === "kamerklaar") m.innerHTML = vKamerKlaar();
  else if (S.fase === "kluis") m.innerHTML = vKluis();
  else if (S.fase === "einde") m.innerHTML = vEinde();
  save();
  if (changed) { lastKey = key; window.scrollTo({top:0}); const a = $("#ber") || $("#ans"); if (a) a.focus({preventScroll:true}); }
}

/* ---- kamer ---- */
function startKamer(k){
  S.kamer = k;
  if (!S.rij.length || S.rijK !== k) { S.rij = bouwRij(k); S.rijK = k; S.qi = 0; }
  S.fase = "kamer";
  startQ();
  render();
}
function startQ(){
  const def = Q[S.rij[S.qi]];
  cur = {def, att:0, hints:0, paid:0, freeUsed:false, done:false, earned:0, msg:null, text:"", sel:[], gaveUp:false, busy:false, fails:0};
  if (def.type === "mc") {
    const idx = def.opts.map((_,i)=>i);
    cur.order = idx.slice();
    if (!def.fixedOrder) { let t = 0; do { shuffle(cur.order); t++; } while (t < 20 && (cur.order.every((v,i)=>v===i) || (!def.multi && cur.order[0] === def.correct[0] && Math.random() < .7))); }
  } else if (def.type === "koppel") {
    cur.left = shuffle(def.pairs.map((_,i)=>i));
    cur.right = shuffle(def.pairs.map((_,i)=>i));
    for (let t = 0; t < 50 && cur.left.some((l,i) => l === cur.right[i]); t++) shuffle(cur.right);
    cur.link = {};         // left -> right
    cur.locked = {};       // left -> true
    cur.pickL = null; cur.lastWrong = [];
  } else if (def.type === "reken") {
    cur.val = ""; cur.ber = ""; cur.berFb = null; cur.berBusy = false;
  } else if (def.type === "kaartjes") {
    cur.f = {}; cur.per = {}; def.velden.forEach(v => { cur.f[v.k] = ""; cur.per[v.k] = ""; }); cur.fok = {};
  } else if (def.type === "open") {
    cur.met = {}; cur.text = "";
  } else if (def.type === "begroting") {
    cur.cell = {}; cur.sel = {}; cur.cok = {}; cur.met = {}; cur.text = "";
  }
}

function vKamer(){
  const d = cur.def, K = KAMERS[S.kamer];
  const prog = S.rij.map((_,i) => `<i class="${i<S.qi?"d":i===S.qi?"c":""}"></i>`).join("");
  const pts = d.pts ? `<span>Te verdienen: <b class="pay">${eur(d.pts)}</b></span>` : `<span>Zoek-opdracht</span>`;
  return `<section class="stack"><div class="meta"><span><b>${K.naam}</b> · opdracht ${S.qi+1} van ${S.rij.length}</span>${pts}</div><div class="prog">${prog}</div></section>

    <div><span class="tag">${d.label}</span></div>
    ${d.tabel ? tabelBox(d.tabel) : ""}${d.box ? kaartBox(d) : ""}

    ${vBody(d)}

    ${cur.berBusy ? `<div class="fb info">De AI kijkt naar je berekening...</div>` : ""}
    ${cur.berFb ? `<div class="fb info"><b>Feedback op je berekening:</b> ${esc(cur.berFb)}</div>` : ""}
    ${vActions(d)}

function kaartBox(d){
  const items = d.box.map(v => `<span>${v[0]}: <b>${v[1]()}</b></span>`).join("");

    (vorige ? `<div class="cards" style="border-style:solid;border-color:var(--good)"><span style="grid-column:1/-1;color:var(--muted)">Dit heb je al uitgerekend:</span>${vorige}</div>` : "");
}
function vBody(d){
  if (d.type === "mc") {
    return `<div class="opts">` + cur.order.map(i => {
      let c = "opt" + (d.multi ? " multi" : "");
      if (cur.sel.includes(i)) c += " sel";
      if (cur.done && d.correct.includes(i)) c += " ok";
      if (cur.mark && cur.mark.includes(i)) c += " no";
      return `<button class="${c}" data-act="kies" data-i="${i}" ${cur.done?"disabled":""}><span class="bx"></span><span>${esc(d.opts[i])}</span></button>`;
    }).join("") + `</div>`;
  }
  if (d.type === "koppel") {
    const colorOf = l => Object.keys(cur.link).indexOf(String(l));
    const L = cur.left.map(l => {
      let c = "mi"; const lk = cur.link[l] !== undefined;
      if (cur.pickL === l) c += " pick";
      if (lk) c += " c" + (colorOf(l)%6);
      if (cur.locked[l]) c += " ok lk";
      if (cur.lastWrong.includes(l)) c += " no";
      return `<button class="${c}" data-act="kl" data-l="${l}" ${cur.done||cur.locked[l]?"":""}>${esc(d.pairs[l][0])}</button>`;
    }).join("");
    const R = cur.right.map(r => {
      const l = Object.keys(cur.link).find(x => cur.link[x] === r);
      let c = "mi"; if (l !== undefined) c += " c" + (colorOf(l)%6);
      if (l !== undefined && cur.locked[l]) c += " ok lk";
      return `<button class="${c}" data-act="kr" data-r="${r}">${esc(d.pairs[r][1])}</button>`;
    }).join("");
    return `<div class="match"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>`;
  }
  if (d.type === "reken") {
    return `<label class="fl" for="ber">Schrijf je berekening op<textarea id="ber" style="min-height:110px" placeholder="Schrijf je som op, bijvoorbeeld: 12 x 5 =" ${cur.done?"disabled":""}>${esc(cur.ber||"")}</textarea></label>
    <div class="inl">${d.unit==="€"?'<span class="unit">€</span>':""}<input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="Typ je antwoord" value="${esc(cur.val)}" ${cur.done?"disabled":""}>${d.unit==="%"?'<span class="unit">%</span>':""}</div>`;
  }
  if (d.type === "kaartjes") {
    const PER = [["week","week"],["twee weken","twee weken"],["maand","maand"],["kwartaal","kwartaal"]];
    const f = v => `<div class="fl">${v.lab}<div class="pr"><input id="f_${v.k}" data-f="${v.k}" type="text" inputmode="decimal" autocomplete="off" placeholder="${v.ph}" value="${esc(cur.f[v.k])}" class="${cur.fok[v.k]===true?"good-field":cur.fok[v.k]===false?"bad-field":""}" ${cur.done?"disabled":""}>` +
      (v.per ? `<select id="p_${v.k}" data-p="${v.k}" aria-label="Per welke periode" class="${cur.fok[v.k]===true?"good-field":cur.fok[v.k]===false?"bad-field":""}" ${cur.done?"disabled":""}><option value="">per...</option>${PER.map(o => `<option value="${o[0]}" ${cur.per[v.k]===o[0]?"selected":""}>per ${o[1]}</option>`).join("")}</select>` : "") + `</div></div>`;
    return `<div class="stack">${d.velden.map(f).join("")}</div>`;
  }
  if (d.type === "open") {
    const res = d.crit.map((c,i) => cur.met[i] ? `<li><span class="k" style="color:var(--good)">✓</span><span>${esc(c.label)}</span></li>` : `<li><span class="k" style="color:var(--bad)">${cur.att?"✗":"·"}</span><span style="color:var(--muted)">${cur.att?"Onderdeel "+(i+1)+" ontbreekt of klopt nog niet":"Onderdeel "+(i+1)}</span></li>`).join("");
    return `<textarea id="txt" placeholder="Typ hier je antwoord..." ${cur.done?"disabled":""} ${d.creatief?'style="min-height:220px"':""}>${esc(cur.text)}</textarea>
      <ul class="crit">${res}</ul>`;
  }
  if (d.type === "begroting") {
    const cls = ok => ok === true ? "good-field" : ok === false ? "bad-field" : "";
    const dis = cur.done ? "disabled" : "";
    const inp = k => `<input id="c_${k}" data-c="${k}" type="text" inputmode="decimal" autocomplete="off" placeholder="€" value="${esc(cur.cell[k]||"")}" class="${cls(cur.cok[k])}" ${dis}>`;
    const links = ["zak","baan"].map(k => `<div class="brow"><span class="bl">${k==="zak"?"Zakgeld per maand":"Bijbaantje per maand"}</span>${inp(k)}</div>`).join("");
    const rechts = BEGR_UIT.map(r => `<div class="brow"><span class="bl">${r[1]}: <span class="bv">${eur2(r[2])}</span></span><select id="s_${r[0]}" data-s="${r[0]}" class="${cls(cur.cok["s_"+r[0]])}" aria-label="Soort uitgave" ${dis}><option value="">Kies de soort</option>${SOORTEN.map(o => `<option value="${o[0]}" ${cur.sel[r[0]]===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`).join("");
    const secs = Object.keys(BEGR).map((id,n) => cur.met[id] ? `<li><span class="k" style="color:var(--good)">✓</span><span>${esc(BEGR[id].label)}</span></li>` : `<li><span class="k" style="color:var(--bad)">${cur.att?"✗":"·"}</span><span style="color:var(--muted)">${cur.att?"Onderdeel "+(n+1)+" ontbreekt of klopt nog niet":"Onderdeel "+(n+1)}</span></li>`).join("");
    return `<div class="bgrid">
        <div class="bcol"><h4>Inkomsten</h4>${links}<div class="brow btot"><span class="bl"><b>Totaal inkomsten</b></span>${inp("totin")}</div></div>
        <div class="bcol"><h4>Uitgaven</h4>${rechts}<div class="brow btot"><span class="bl"><b>Totaal uitgaven</b></span>${inp("totuit")}</div></div>
      </div>
      <div class="bcol"><div class="brow"><span class="bl"><b>Inkomsten min uitgaven</b></span>${inp("saldo")}<select id="s_saldosoort" data-s="saldosoort" class="${cls(cur.cok["s_saldosoort"])}" aria-label="Tekort of overschot" ${dis}><option value="">Kies</option><option value="tekort" ${cur.sel.saldosoort==="tekort"?"selected":""}>Tekort</option><option value="overschot" ${cur.sel.saldosoort==="overschot"?"selected":""}>Overschot</option></select></div></div>
      <ul class="crit">${secs}</ul>`;
  }
  return "";
}
function vActions(d){
  if (cur.done) {
    const last = S.qi === S.rij.length-1;
    return `<div class="row"><button class="btn gold" data-act="volgende">${last ? "Kamer afronden" : "Volgende opdracht"}</button></div>`;
  }
  let b = "";
  if (d.type === "mc") b = `<button class="btn gold" data-act="check" ${cur.sel.length?"":"disabled"}>Controleer</button>`;
  else if (d.type === "koppel") b = `<button class="btn gold" data-act="check" ${Object.keys(cur.link).length === d.pairs.length ? "" : "disabled"}>Controleer</button>`;
  else if (d.type === "begroting") b = `<button class="btn gold" data-act="check">Controleer</button>`;
  else if (d.type === "open") b = `<button class="btn gold" data-act="check" ${cur.busy?"disabled":""}>${cur.busy ? "Aan het nakijken..." : "Laat nakijken"}</button>`;
  else b = `<button class="btn gold" data-act="check">Controleer</button>`;
  const give = (cur.att >= 3 || cur.fails >= 3) ? `<button class="btn ghost" data-act="geefop">Toon het antwoord (€0)</button>` : "";
  return `<div class="row">${b}${give}</div>`;
}
function vHints(d){
  if (cur.done) return "";
  const n = cur.hints, max = d.hints.length;
  const list = d.hints.slice(0,n).map(h => `<div class="hint">${esc(h)}</div>`).join("");
  const cost = CONFIG.HINT_KOSTEN[Math.min(cur.paid, CONFIG.HINT_KOSTEN.length-1)];
  const can = n < max && S.saldo >= cost;
  const btn = n >= max ? `<button class="btn small ghost" disabled>Geen hints meer</button>`
    : `<button class="btn small" data-act="hint" ${can?"":"disabled"}>Koop hint ${n+1} (${eur(cost)})</button>`;
  return `<section class="hints">${list}<div class="row">${btn}</div></section>`;
}

/* ---- beloningen en afronden ---- */
function award(base, att){
  const a = Math.round(base * factor(att));
  S.saldo += a; cur.earned += a; return a;
}
function payTxt(a, att){
  const t = att <= 1 ? "Meteen goed: volle prijs!" : att === 2 ? "Tweede poging: de helft." : "Derde poging of later: een kwart.";
  return `<div class="fb good"><b>Goed!</b> Je verdient <span class="pay">${eur(a)}</span>. ${t}</div>`;
}
function wrongTxt(extra){
  const nxt = cur.att === 1 ? "Opnieuw proberen levert de helft op." : "Opnieuw proberen levert een kwart op.";
  return `<div class="fb bad"><b>Nog niet goed.</b> ${extra ? extra + " " : ""}${nxt}</div>`;
}
function finishGood(a){
  cur.done = true; cur.msg = a ? payTxt(a, cur.att) : `<div class="fb good"><b>Goed!</b></div>`;
  tweenAfter();
}
function tweenAfter(){ render(); setTimeout(tweenSaldo, 30); }

/* ---- controleren ---- */
function checkMC(){
  const d = cur.def; cur.att++;
  const sel = cur.sel.slice().sort(), ok = d.correct.slice().sort();
  const good = sel.length === ok.length && sel.every((v,i) => v === ok[i]);
  if (good) { cur.mark = null; finishGood(award(d.pts, cur.att)); }
  else {
    cur.mark = sel.filter(i => !d.correct.includes(i));
    cur.msg = wrongTxt(d.multi && sel.some(i=>d.correct.includes(i)) ? "Een deel klopt, maar er mist er nog een of er staat er een te veel bij." : "");
    cur.fails++; render();
    cur.sel = []; // keuze wissen na foute poging
    setTimeout(() => { if (cur && !cur.done) { cur.mark = null; render(); } }, 900);
  }
}
function checkReken(){
  const d = cur.def, v = parseNum(cur.val);
  if ((cur.ber || "").trim().length < 3 || !/\d/.test(cur.ber)) { cur.msg = `<div class="fb info">Schrijf eerst je berekening op in het bovenste vak. Daarna typ je het antwoord.</div>`; render(); return; }
  cur.berFb = null;
  if (isNaN(v)) { cur.msg = `<div class="fb info">Typ een getal, bijvoorbeeld 12,5.</div>`; render(); return; }
  cur.att++;
  const raw = d.raw(), exp = Number(raw.toFixed(d.dec));
  const goed = Math.abs(v-exp) < 1e-9;
  if (goed) finishGood(award(d.pts, cur.att));
  else {
    cur.fails++;
    const near = Math.abs(v-raw) <= Math.pow(10,-d.dec) * 1.01;
    cur.msg = wrongTxt(near ? "Het getal ligt dichtbij. Controleer de afronding." : "");
    render();
  }
  berekeningFeedback(goed, exp);
}
async function berekeningFeedback(goed, exp){
  if (!CONFIG.WORKER_URL) return;
  const mine = cur, d = cur.def;
  mine.berBusy = true; render();
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(CONFIG.WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
      body: JSON.stringify({mode:"berekening", vraag:d.q, formule:d.formule || "", berekening:String(mine.ber).slice(0,800), antwoord:String(mine.val).slice(0,40), juist:goed, juistAntwoord:String(exp)})});
    clearTimeout(to);
    if (!r.ok) throw new Error("status " + r.status);
    const j = await r.json();
    mine.berFb = String(j.feedback || "").slice(0,400);
  } catch(e) { mine.berFb = null; }
  mine.berBusy = false;
  if (cur === mine) render();
}
function checkKaartjes(){
  let all = true; cur.att++;
  for (const v of cur.def.velden) { const ok = parseNum(cur.f[v.k]) === v.want && (!v.per || cur.per[v.k] === v.per); cur.fok[v.k] = ok; if (!ok) all = false; }
  if (all) { finishGood(0); cur.msg = `<div class="fb good"><b>Gevonden!</b> Met deze gegevens kun je de lening uitrekenen.</div>`; render(); }
  else { cur.fails++; cur.msg = `<div class="fb bad"><b>Nog niet alles klopt.</b> De rode velden kloppen niet. Kijk nog eens goed op de kaartjes. Een hint kan helpen.</div>`; render(); }
}
function checkKoppel(){
  const d = cur.def; cur.att++;
  const wrong = [];
  for (const l of Object.keys(cur.link)) { if (cur.locked[l]) continue; if (Number(cur.link[l]) === Number(l)) cur.locked[l] = true; else wrong.push(l); }
  if (!wrong.length) { finishGood(award(d.pts, cur.att)); return; }
  cur.fails++;
  cur.lastWrong = wrong.map(Number);
  cur.msg = wrongTxt(`${wrong.length} van de ${d.pairs.length} koppelingen klopt nog niet. De rest staat vast.`);
  render();
  setTimeout(() => { if (!cur || cur.done) return; wrong.forEach(l => delete cur.link[l]); cur.lastWrong = []; render(); }, 1100);
}

/* ---- open vragen: AI of demo ---- */
async function beoordeelAI(vraag, crit, text){
  if (CONFIG.WORKER_URL && (cur.aiFails||0) < 2) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch(CONFIG.WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
        body: JSON.stringify({vraag, criteria:crit.map((c,i)=>({id:i, tekst:c.tekst})), antwoord:text.slice(0,1500)})});
      clearTimeout(to);
      if (!r.ok) throw new Error("status " + r.status);
      const j = await r.json();
      return {ok: crit.map((_,i) => !!(j.resultaten && (j.resultaten[i] === true || j.resultaten[String(i)] === true))), fb:String(j.feedback || ""), viaAI:true};
    } catch(e) {
      cur.aiFails = (cur.aiFails||0) + 1; cur.aiErr = String(e && e.message || e);
      if (cur.aiFails < 2) return {retry:true};
    }
  }
  return {ok: crit.map(c => !!critMatch(c, text)), fb:"", viaAI:false};
}
function gratisHint(){
  const d = cur.def;
  if (!cur.freeUsed && cur.hints < d.hints.length) { cur.freeUsed = true; cur.hints++; return ` <b>Je krijgt een gratis hint.</b> Lees hem goed onder de opdracht en denk zelf na over wat je kunt verbeteren.`; }
  return "";
}
async function checkOpen(){
  const d = cur.def, text = (cur.text || "").trim();
  if (text.length < 6) { cur.msg = `<div class="fb info">Schrijf eerst je antwoord op.</div>`; render(); return; }
  cur.busy = true; render();
  const res = await beoordeelAI(d.q, d.crit, text);
  if (res.retry) { cur.busy = false; cur.msg = `<div class="fb info">De nakijkhulp reageert niet. Probeer het nog een keer.<div style="margin-top:6px;color:var(--muted);font-size:14px">Foutcode: ${esc(cur.aiErr||"")}</div></div>`; render(); return; }
  cur.busy = false; cur.att++;
  let got = 0; const share = d.pts / d.crit.length;
  res.ok.forEach((ok,i) => { if (ok && !cur.met[i]) { cur.met[i] = true; got += Math.round(share * factor(cur.att)); } });
  S.saldo += got; cur.earned += got;
  const allMet = d.crit.every((_,i) => cur.met[i]);
  const fbTxt = res.fb ? `<div style="margin-top:6px">${esc(res.fb)}</div>` : "";
  if (allMet) { cur.done = true; cur.msg = `<div class="fb good"><b>Compleet!</b> In totaal verdiend: <span class="pay">${eur(cur.earned)}</span>.${fbTxt}</div>`; }
  else {
    cur.fails++;
    const n = d.crit.filter((_,i)=>cur.met[i]).length;
    cur.msg = `<div class="fb bad"><b>${n} van de ${d.crit.length} onderdelen kloppen.</b>${gratisHint()} ${got ? `Je verdiende <span class="pay">${eur(got)}</span>. ` : ""}Verbeter je antwoord en laat opnieuw nakijken.${fbTxt}${res.viaAI ? "" : '<div style="margin-top:6px;color:var(--muted);font-size:15px">(demo-nakijker)</div>'}</div>`;
  }
  tweenAfter();
}
function checkBegroting(){
  const d = cur.def;
  cur.att++;
  const f = factor(cur.att); let got = 0; cur.cok = {};
  for (const id of Object.keys(BEGR)) {
    const sec = BEGR[id]; let ok = true;
    for (const [k,want] of Object.entries(sec.cells || {})) {
      const v = parseNum(cur.cell[k] || "");
      const good = !isNaN(v) && Math.abs((k === "saldo" ? Math.abs(v) : v) - want) < 1e-9;
      cur.cok[k] = good; if (!good) ok = false;
    }
    for (const [k,want] of Object.entries(sec.sel || {})) {
      const good = cur.sel[k] === want; cur.cok["s_"+k] = good; if (!good) ok = false;
    }
    if (ok && !cur.met[id]) { cur.met[id] = true; got += Math.round(sec.pts * f); }
  }
  S.saldo += got; cur.earned += got;
  const ids = Object.keys(BEGR), n = ids.filter(id => cur.met[id]).length;
  if (n === ids.length) { cur.done = true; cur.msg = `<div class="fb good"><b>Compleet!</b> In totaal verdiend: <span class="pay">${eur(cur.earned)}</span>.</div>`; }
  else {
    cur.fails++;
    cur.msg = `<div class="fb bad"><b>${n} van de ${ids.length} onderdelen kloppen.</b>${gratisHint()} ${got ? `Je verdiende <span class="pay">${eur(got)}</span>. ` : ""}Rode vakjes kloppen nog niet. Verbeter ze en controleer opnieuw.</div>`;
  }
  tweenAfter();
}

function geefOp(){
  const d = cur.def; let ans = "";
  if (d.type === "mc") ans = d.correct.map(i => d.opts[i]).join(" en ");
  else if (d.type === "reken") ans = (d.unit==="€"?"€":"") + nf(Number(d.raw().toFixed(d.dec)), d.dec) + (d.unit==="%"?"%":"");
  else if (d.type === "koppel") ans = d.pairs.map(p => p[0] + " = " + p[1]).join("; ");
  else if (d.type === "open" || d.type === "begroting") ans = d.model;
  else if (d.type === "kaartjes") ans = d.model;
  if (d.type === "koppel") d.pairs.forEach((_,i) => { cur.link[i] = i; cur.locked[i] = true; });
  if (d.type === "mc") cur.sel = d.correct.slice();
  cur.done = true; cur.gaveUp = true;
  cur.msg = `<div class="fb info"><b>Het antwoord was:</b> ${esc(ans)}</div>`;
  render();
}

/* ---- kamer klaar ---- */
function vKamerKlaar(){
  const k = S.kamer, c = CONFIG.KAMER_CIJFERS[k];
  return `<section class="card fin"><span class="tag">Kamer ${k} gehaald</span>
    <h2>${KAMERS[k].naam} is geopend</h2>
    <p class="lead">Dit cijfer hoort bij de kluiscode:</p>
    <div class="slot f" style="width:110px;height:130px;font-size:72px">${c}</div>
    <p>Onthoud het of bekijk het bovenin. Jullie saldo is nu <b class="pay">${eur(S.saldo)}</b>.</p>
    <button class="btn gold" data-act="lobby">Terug naar de gang</button></section>`;
}

/* ---- kluis (Mastermind) ---- */
let kl = {slots:[null,null,null,null]};
function vKluis(){
  const have = Object.values(S.cijfers);
  const used = kl.slots.filter(x => x !== null);
  const tokens = have.map(n => `<button class="tok" data-act="tok" data-n="${n}" ${used.includes(n)?"disabled":""} aria-label="Cijfer ${n}">${n}</button>`).join("");
  const slots = kl.slots.map(n => `<div class="slot ${n!==null?"f":""}">${n!==null?n:""}</div>`).join("");
  const filled = kl.slots.every(x => x !== null);
  const hist = S.poging.map(p => `<div class="hr">${p.d.map((n,i)=>`<div class="ht ${p.r[i]}">${n}<small>${p.r[i]==="g"?"✓":p.r[i]==="y"?"~":"·"}</small></div>`).join("")}</div>`).join("");
  return `<section class="card vault"><h2>De kluis</h2>
    <p class="lead" style="text-align:center">Zet de vier cijfers in de goede volgorde. Je mag zo vaak proberen als je wilt.</p>
    <div class="slots">${slots}</div>
    <div class="tokens">${tokens}</div>
    <div class="row"><button class="btn ghost" data-act="wis">Wis alles</button><button class="btn gold" data-act="open" ${filled?"":"disabled"}>Open de kluis</button></div>
    <div class="legend"><span><i style="background:var(--good)"></i> Goede plek</span><span><i style="background:var(--warn)"></i> Cijfer klopt, plek niet</span><span><i style="background:var(--panel-2)"></i> Staat er niet op die plek</span></div>
    ${hist ? `<div class="hist">${hist}</div>` : ""}
  </section><div class="foot"><button class="link" data-act="lobby">Terug naar de gang</button></div>`;
}
function proefKluis(){
  const g = kl.slots.slice(), code = CONFIG.KLUISCODE.slice();
  const r = g.map((n,i) => n === code[i] ? "g" : "n");
  const rest = {}; code.forEach((n,i) => { if (r[i] !== "g") rest[n] = (rest[n]||0)+1; });
  g.forEach((n,i) => { if (r[i] !== "g" && rest[n] > 0) { r[i] = "y"; rest[n]--; } });
  S.poging.push({d:g, r});
  if (r.every(x => x === "g")) { S.fase = "einde"; S.t1 = Date.now(); render(); confetti(); return; }
  kl.slots = [null,null,null,null]; render();
}

/* ---- einde ---- */
function vEinde(){
  const min = Math.max(1, Math.round(((S.t1 || Date.now()) - (S.t0 || Date.now()))/60000));
  return `<section class="fin"><div class="stamp">KLUIS OPEN</div>
    <h1>${esc(S.duo || "Jullie")} zijn miljonair!</h1>
    <div class="money">${eur(S.saldo)}</div>
    <p class="lead">in ${min} ${min===1?"minuut":"minuten"} · ${S.poging.length} ${S.poging.length===1?"poging":"pogingen"} in de kluis</p>
  </section>
  <section class="card fin"><span class="tag">Beloning</span>
    <h2>Laat dit scherm aan de meester zien</h2>
    <p>Het codewoord voor jullie tractatie is:</p>
    <div class="stamp" style="transform:none">${esc(CONFIG.CODEWOORD)}</div>
    <p class="lead">Het duo met het meeste geld krijgt er één extra.</p></section>`;
}

/* ---- confetti ---- */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const g = c.getContext("2d"), cols = ["#f2b632","#4fd08a","#6aa8ff","#ff9bd0","#f4efe2"];
  const P = Array.from({length:140}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, s:6+Math.random()*8, r:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let f = 0;
  (function loop(){ g.clearRect(0,0,c.width,c.height); P.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=.1; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); });
    if (++f < 260) requestAnimationFrame(loop); else { c.hidden = true; } })();
}

/* =========================================================
   ACTIES
   ========================================================= */
const A = {
  begin(){
    const v = ($("#duo").value || "").trim();
    if (v.length < 2) { toast("Vul eerst jullie namen in."); return; }
    S.duo = v; S.fase = "lobby"; S.t0 = Date.now(); render(); applyHash();
  },
  meester(){ S.test = !S.test; render(); },
  testklaar(){ [1,2,3,4].filter(k => !KAMERS[k].beschikbaar).forEach(k => { S.klaar[k] = true; S.cijfers[k] = CONFIG.KAMER_CIJFERS[k]; }); render(); toast("De nog niet gebouwde kamers staan op klaar."); },
  reset(){ try { localStorage.removeItem(LS); } catch(e){} const t = S.test; S = fresh(); S.test = t; shown = S.saldo; cur = null; kl = {slots:[null,null,null,null]}; render(); },
  deur(el){
    const k = Number(el.dataset.k), K = KAMERS[k];
    if (S.klaar[k]) return;
    if (!K.beschikbaar) { toast("Deze kamer wordt nog gebouwd."); return; }
    if (S.open[k] || S.test) { S.open[k] = true; S.deurK = null; startKamer(k); return; }
    S.deurK = k; render();
  },
  kcode(){
    const v = ($("#kcode").value || "").trim().toUpperCase(), k = S.deurK;
    if (v === CONFIG.KAMERCODES[k]) { S.open[k] = true; S.deurK = null; toast("Kamer " + k + " is open!"); startKamer(k); }
    else $("#kmsg").innerHTML = `<div class="fb bad" style="margin-top:10px">Die code klopt niet. Kijk nog eens goed bij de QR-code.</div>`;
  },
  lobby(){ S.fase = "lobby"; S.deurK = null; render(); },
  naarkluis(){ S.fase = "kluis"; kl = {slots:[null,null,null,null]}; render(); },
  kies(el){
    const i = Number(el.dataset.i), d = cur.def;
    if (cur.done) return;
    if (d.multi) cur.sel = cur.sel.includes(i) ? cur.sel.filter(x => x !== i) : cur.sel.concat(i);
    else cur.sel = [i];
    cur.mark = null; cur.msg = null; render();
  },
  kl(el){
    const l = Number(el.dataset.l); if (cur.done || cur.locked[l]) return;
    if (cur.link[l] !== undefined) { delete cur.link[l]; cur.pickL = null; }
    else cur.pickL = (cur.pickL === l ? null : l);
    cur.msg = null; render();
  },
  kr(el){
    const r = Number(el.dataset.r); if (cur.done) return;
    const owner = Object.keys(cur.link).find(x => cur.link[x] === r);
    if (owner !== undefined) { if (!cur.locked[owner]) delete cur.link[owner]; cur.msg = null; render(); return; }
    if (cur.pickL === null) { toast("Tik eerst links op een begrip."); return; }
    cur.link[cur.pickL] = r; cur.pickL = null; cur.msg = null; render();
  },
  check(){
    const t = cur.def.type;
    if (t === "mc") checkMC(); else if (t === "reken") checkReken(); else if (t === "koppel") checkKoppel();
    else if (t === "kaartjes") checkKaartjes(); else if (t === "open") checkOpen(); else if (t === "begroting") checkBegroting();
  },
  geefop: geefOp,
  hint(){
    const d = cur.def, n = cur.hints, cost = CONFIG.HINT_KOSTEN[Math.min(cur.paid, CONFIG.HINT_KOSTEN.length-1)];
    if (n >= d.hints.length || S.saldo < cost) return;
    S.saldo -= cost; cur.hints++; cur.paid++; render(); setTimeout(tweenSaldo, 30);
  },
  volgende(){
    if (S.qi < S.rij.length-1) { S.qi++; startQ(); render(); }
    else {
      const k = S.kamer; S.klaar[k] = true; S.cijfers[k] = CONFIG.KAMER_CIJFERS[k]; S.rij = []; S.rijK = null; S.qi = 0;
      S.fase = "kamerklaar"; render();
    }
  },
  tok(el){ const n = Number(el.dataset.n); const i = kl.slots.indexOf(null); if (i < 0 || kl.slots.includes(n)) return; kl.slots[i] = n; render(); },
  wis(){ kl.slots = [null,null,null,null]; render(); },
  open(){ if (kl.slots.every(x => x !== null)) proefKluis(); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && A[el.dataset.act]) A[el.dataset.act](el, e); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "ans" && cur) cur.val = t.value;
  else if (t.id === "txt" && cur) cur.text = t.value;
  else if (t.id === "ber" && cur) cur.ber = t.value;
  else if (t.dataset && t.dataset.f && cur) cur.f[t.dataset.f] = t.value;
  else if (t.dataset && t.dataset.p && cur) cur.per[t.dataset.p] = t.value;
  else if (t.dataset && t.dataset.c && cur) cur.cell[t.dataset.c] = t.value;
  else if (t.dataset && t.dataset.s && cur) cur.sel[t.dataset.s] = t.value;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "ans") { e.preventDefault(); A.check(); }
  if (e.key === "Enter" && e.target.id === "duo") { e.preventDefault(); A.begin(); }
  if (e.key === "Enter" && e.target.id === "kcode") { e.preventDefault(); A.kcode(); }
});

/* QR-code: de link eindigt op #k3 (kamer 3) */
function applyHash(){
  const m = /^#k([1-4])$/.exec(location.hash || "");
  if (!m || S.fase === "start") return;
  const k = Number(m[1]);
  if (!S.open[k]) { S.open[k] = true; toast("Kamer " + k + " is ontgrendeld!"); }
  if (S.fase === "lobby") render();
}
addEventListener("hashchange", applyHash);

/* start */
(function init(){
  const old = load();
  if (old && old.fase !== "start" && old.fase !== "einde") {
    S = old; shown = S.saldo;
    if (S.fase === "kamer") { startQ(); }
  }
  render(); applyHash();
})();
window.__G = {get S(){return S}, get cur(){return cur}, Q, A, CONFIG, KAART};
</script>
